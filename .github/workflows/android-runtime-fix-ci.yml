name: Android Runtime Fix CI

on:
  push:
    branches:
      - fix/real-android-runtime
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Android runtime helper tests
        run: npm run test:runtime
      - name: Production build
        run: npm run build
